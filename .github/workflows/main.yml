name: Build Box Breath APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write the project
        run: |
          mkdir -p app/src/main/java/com/rey/boxbreath
          cat > settings.gradle.kts <<'SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BoxBreath"
          include(":app")
          SETTINGS
          cat > build.gradle.kts <<'ROOTBUILD'
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          ROOTBUILD
          cat > gradle.properties <<'GRADLEPROPS'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          GRADLEPROPS
          cat > app/build.gradle.kts <<'APPBUILD'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.rey.boxbreath"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.rey.boxbreath"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          APPBUILD
          cat > app/src/main/AndroidManifest.xml <<'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="Box Breath"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".BreathService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Paced breathing guidance by vibration with the screen off" />
                  </service>
              </application>
          </manifest>
          MANIFEST
          cat > app/src/main/java/com/rey/boxbreath/BoxBreath.kt <<'KOTLIN'
          package com.rey.boxbreath

          import android.app.Activity
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.os.SystemClock
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          private const val BG = 0xFF0F1419.toInt()
          private const val INK = 0xFFE8EEF4.toInt()
          private const val MUTED = 0xFF7F8F9D.toInt()
          private const val ACCENT = 0xFF4D94D6.toInt()

          enum class Phase(val label: String) {
              INHALE("Breathe in"),
              HOLD_FULL("Hold"),
              EXHALE("Breathe out"),
              HOLD_EMPTY("Hold")
          }

          /** One phase of a cycle: what to do, and for how long. */
          class Step(val phase: Phase, val millis: Long)

          /**
           * A breathing pattern is just an ordered list of steps, so box breathing and
           * paced (hold-free) breathing are the same machinery with different data.
           */
          class Pattern(val name: String, val steps: List<Step>) {

              /** Breaths per minute, for the label — one breath is one full cycle. */
              val perMinute: Double
                  get() = 60000.0 / steps.sumOf { it.millis }

              val label: String
                  get() = name + "  ·  " + String.format("%.1f", perMinute) + "/min"

              companion object {
                  private fun box(sec: Double) = Pattern(
                      "Box " + trim(sec) + "-" + trim(sec) + "-" + trim(sec) + "-" + trim(sec),
                      listOf(Phase.INHALE, Phase.HOLD_FULL, Phase.EXHALE, Phase.HOLD_EMPTY)
                          .map { Step(it, (sec * 1000).toLong()) }
                  )

                  private fun paced(inSec: Double, outSec: Double) = Pattern(
                      "Paced " + trim(inSec) + "-" + trim(outSec),
                      listOf(
                          Step(Phase.INHALE, (inSec * 1000).toLong()),
                          Step(Phase.EXHALE, (outSec * 1000).toLong())
                      )
                  )

                  private fun trim(v: Double) =
                      if (v == Math.floor(v)) v.toInt().toString() else v.toString()

                  /** Paced first: around six breaths a minute is the resonance range. */
                  val ALL = listOf(
                      paced(5.5, 5.5),
                      paced(5.0, 5.0),
                      paced(4.0, 6.0),
                      paced(6.0, 6.0),
                      box(4.0),
                      box(5.0),
                      box(6.0)
                  )
              }
          }

          /**
           * Runs the breathing cycle and marks each phase change with a vibration.
           *
           * A foreground service holding a partial wake lock, because the whole point is
           * to work with the screen off and the phone in a pocket. Without both, Android
           * throttles the timer within a minute or two and the cue drifts or stops.
           */
          class BreathService : Service() {

              companion object {
                  const val ACTION_STOP = "com.rey.boxbreath.STOP"
                  const val EXTRA_PATTERN = "pattern_index"
                  const val EXTRA_TOTAL_MINUTES = "total_minutes"

                  private const val CHANNEL_ID = "breath"
                  private const val NOTIFICATION_ID = 1

                  @Volatile
                  var running: Boolean = false
                      private set

                  /** The phase being cued RIGHT NOW. Never advanced before the UI sees it. */
                  @Volatile
                  var currentPhase: Phase = Phase.INHALE
                      private set

                  @Volatile
                  var cycleCount: Int = 0
                      private set

                  var listener: (() -> Unit)? = null

                  private fun notifyUi() = Handler(Looper.getMainLooper()).post { listener?.invoke() }
              }

              private val handler = Handler(Looper.getMainLooper())
              private var wakeLock: PowerManager.WakeLock? = null
              private var pattern: Pattern = Pattern.ALL[0]
              private var stepIndex = 0
              private var endAtUptime = 0L
              private var nextStepAt = 0L

              private val vibrator: Vibrator by lazy {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      (getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager).defaultVibrator
                  } else {
                      @Suppress("DEPRECATION")
                      getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopEverything()
                      return START_NOT_STICKY
                  }
                  val pIndex = intent?.getIntExtra(EXTRA_PATTERN, 0) ?: 0
                  val totalMinutes = intent?.getIntExtra(EXTRA_TOTAL_MINUTES, 10) ?: 10
                  startSession(pIndex, totalMinutes)
                  return START_STICKY
              }

              private fun startSession(patternIndex: Int, totalMinutes: Int) {
                  pattern = Pattern.ALL[patternIndex.coerceIn(0, Pattern.ALL.size - 1)]

                  createChannel()
                  startForeground(NOTIFICATION_ID, buildNotification(Phase.INHALE))

                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "BoxBreath::session").apply {
                      setReferenceCounted(false)
                      val cap = if (totalMinutes > 0) (totalMinutes + 1) * 60_000L else 90 * 60_000L
                      acquire(cap)
                  }

                  stepIndex = 0
                  currentPhase = pattern.steps[0].phase
                  cycleCount = 0
                  running = true
                  endAtUptime =
                      if (totalMinutes > 0) SystemClock.uptimeMillis() + totalMinutes * 60_000L else 0L

                  // Three quick taps say "starting" — distinct from any phase cue.
                  vibratePattern(longArrayOf(0, 70, 90, 70, 90, 70), intArrayOf(0, 180, 0, 180, 0, 180))

                  // The first phase begins a beat later, so its cue doesn't blur into the
                  // start signal. Fire it through the same path the rest of the cycle uses.
                  nextStepAt = SystemClock.uptimeMillis() + 1200L
                  handler.postAtTime(tick, nextStepAt)
                  notifyUi()
              }

              /**
               * Fires the CURRENT step, then schedules its successor. The phase is never
               * advanced before the cue and the screen have both used it — an earlier
               * version advanced first, which put every label one step ahead of the buzz
               * it was describing.
               */
              private val tick = object : Runnable {
                  override fun run() {
                      if (!running) return

                      if (endAtUptime != 0L && SystemClock.uptimeMillis() >= endAtUptime) {
                          vibratePattern(longArrayOf(0, 500, 200, 500), intArrayOf(0, 255, 0, 255))
                          handler.postDelayed({ stopEverything() }, 1400)
                          return
                      }

                      val step = pattern.steps[stepIndex]
                      currentPhase = step.phase
                      cue(step.phase)
                      updateNotification(step.phase)
                      notifyUi()

                      // Absolute scheduling, so a long session cannot drift.
                      nextStepAt += step.millis
                      val now = SystemClock.uptimeMillis()
                      if (nextStepAt <= now) nextStepAt = now + step.millis

                      stepIndex++
                      if (stepIndex >= pattern.steps.size) {
                          stepIndex = 0
                          cycleCount++
                      }

                      handler.postAtTime(this, nextStepAt)
                  }
              }

              /**
               * The vibration language, readable through a trouser pocket while walking.
               * The cues differ in shape, not just length, and the holds are long enough
               * to actually register — 90ms was below the threshold on most phones.
               */
              private fun cue(phase: Phase) = when (phase) {
                  Phase.INHALE -> vibratePattern(longArrayOf(0, 700), intArrayOf(0, 255))
                  Phase.EXHALE -> vibratePattern(longArrayOf(0, 260, 150, 260), intArrayOf(0, 230, 0, 230))
                  Phase.HOLD_FULL -> vibratePattern(longArrayOf(0, 140), intArrayOf(0, 190))
                  Phase.HOLD_EMPTY -> vibratePattern(longArrayOf(0, 140), intArrayOf(0, 190))
              }

              private fun vibratePattern(timings: LongArray, amplitudes: IntArray) {
                  try {
                      vibrator.cancel()
                      val effect = if (vibrator.hasAmplitudeControl()) {
                          VibrationEffect.createWaveform(timings, amplitudes, -1)
                      } else {
                          VibrationEffect.createWaveform(timings, -1)
                      }
                      vibrator.vibrate(effect)
                  } catch (e: Exception) {
                      // A missing or busy vibrator must never take the session down.
                  }
              }

              private fun stopEverything() {
                  running = false
                  handler.removeCallbacksAndMessages(null)
                  try {
                      vibrator.cancel()
                  } catch (e: Exception) {
                  }
                  wakeLock?.let { if (it.isHeld) it.release() }
                  wakeLock = null
                  notifyUi()
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              override fun onDestroy() {
                  running = false
                  handler.removeCallbacksAndMessages(null)
                  wakeLock?.let { if (it.isHeld) it.release() }
                  wakeLock = null
                  notifyUi()
                  super.onDestroy()
              }

              private fun createChannel() {
                  val mgr = getSystemService(NotificationManager::class.java)
                  if (mgr.getNotificationChannel(CHANNEL_ID) == null) {
                      val channel = NotificationChannel(
                          CHANNEL_ID, "Breathing session", NotificationManager.IMPORTANCE_LOW
                      )
                      channel.setShowBadge(false)
                      channel.enableVibration(false)
                      channel.setSound(null, null)
                      mgr.createNotificationChannel(channel)
                  }
              }

              private fun buildNotification(phase: Phase): Notification {
                  val open = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val stop = PendingIntent.getService(
                      this, 1, Intent(this, BreathService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  return Notification.Builder(this, CHANNEL_ID)
                      .setContentTitle(phase.label)
                      .setContentText(pattern.name + " - cycle " + (cycleCount + 1))
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setContentIntent(open)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .addAction(Notification.Action.Builder(null, "Stop", stop).build())
                      .build()
              }

              private fun updateNotification(phase: Phase) {
                  try {
                      getSystemService(NotificationManager::class.java)
                          .notify(NOTIFICATION_ID, buildNotification(phase))
                  } catch (e: Exception) {
                  }
              }
          }

          class MainActivity : Activity() {

              private val lengthOptions = listOf(5, 10, 15, 0)
              private var patternIndex = 0
              private var lengthIndex = 1

              private lateinit var phaseLabel: TextView
              private lateinit var cycleLabel: TextView
              private lateinit var startBtn: Button
              private lateinit var patternBtn: Button
              private lateinit var lengthBtn: Button
              private lateinit var legend: TextView

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.gravity = Gravity.CENTER
                  root.setBackgroundColor(BG)
                  root.setPadding(dp(28), dp(28), dp(28), dp(28))

                  val wrap = ViewGroup.LayoutParams.WRAP_CONTENT
                  val match = ViewGroup.LayoutParams.MATCH_PARENT

                  phaseLabel = TextView(this)
                  phaseLabel.textSize = 38f
                  phaseLabel.setTextColor(INK)
                  phaseLabel.gravity = Gravity.CENTER
                  root.addView(phaseLabel, LinearLayout.LayoutParams(match, wrap))

                  cycleLabel = TextView(this)
                  cycleLabel.textSize = 14f
                  cycleLabel.setTextColor(MUTED)
                  cycleLabel.gravity = Gravity.CENTER
                  val cycleLp = LinearLayout.LayoutParams(match, wrap)
                  cycleLp.topMargin = dp(12)
                  cycleLp.bottomMargin = dp(40)
                  root.addView(cycleLabel, cycleLp)

                  startBtn = Button(this)
                  startBtn.textSize = 19f
                  startBtn.setBackgroundColor(ACCENT)
                  startBtn.setTextColor(Color.BLACK)
                  root.addView(startBtn, LinearLayout.LayoutParams(match, dp(64)))

                  patternBtn = Button(this)
                  patternBtn.setTextColor(MUTED)
                  patternBtn.setBackgroundColor(Color.TRANSPARENT)
                  val patternLp = LinearLayout.LayoutParams(match, wrap)
                  patternLp.topMargin = dp(20)
                  root.addView(patternBtn, patternLp)

                  lengthBtn = Button(this)
                  lengthBtn.setTextColor(MUTED)
                  lengthBtn.setBackgroundColor(Color.TRANSPARENT)
                  root.addView(lengthBtn, LinearLayout.LayoutParams(match, wrap))

                  legend = TextView(this)
                  legend.textSize = 13f
                  legend.setTextColor(MUTED)
                  legend.gravity = Gravity.CENTER
                  val legendLp = LinearLayout.LayoutParams(match, wrap)
                  legendLp.topMargin = dp(32)
                  root.addView(legend, legendLp)

                  setContentView(root)

                  startBtn.setOnClickListener {
                      if (BreathService.running) stopSession() else startSession()
                  }
                  patternBtn.setOnClickListener {
                      patternIndex = (patternIndex + 1) % Pattern.ALL.size
                      render()
                  }
                  lengthBtn.setOnClickListener {
                      lengthIndex = (lengthIndex + 1) % lengthOptions.size
                      render()
                  }

                  BreathService.listener = { render() }
                  render()
              }

              override fun onResume() {
                  super.onResume()
                  render()
              }

              override fun onDestroy() {
                  BreathService.listener = null
                  super.onDestroy()
              }

              private fun startSession() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU &&
                      checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS)
                      != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 1)
                  }

                  val intent = Intent(this, BreathService::class.java)
                  intent.putExtra(BreathService.EXTRA_PATTERN, patternIndex)
                  intent.putExtra(BreathService.EXTRA_TOTAL_MINUTES, lengthOptions[lengthIndex])
                  startForegroundService(intent)

                  startBtn.postDelayed({ render() }, 300)
              }

              private fun stopSession() {
                  startService(Intent(this, BreathService::class.java).setAction(BreathService.ACTION_STOP))
                  startBtn.postDelayed({ render() }, 300)
              }

              private fun render() {
                  val on = BreathService.running
                  val p = Pattern.ALL[patternIndex]

                  startBtn.text = if (on) "Stop" else "Start"
                  patternBtn.isEnabled = !on
                  lengthBtn.isEnabled = !on

                  patternBtn.text = p.label
                  val len = lengthOptions[lengthIndex]
                  lengthBtn.text = if (len == 0) "Until I stop" else "$len minutes"

                  legend.text = if (p.steps.size == 2) {
                      "One long buzz - breathe in\nTwo buzzes - breathe out"
                  } else {
                      "One long buzz - breathe in\nOne tap - hold\n" +
                              "Two buzzes - breathe out\nOne tap - hold"
                  }

                  if (on) {
                      phaseLabel.text = BreathService.currentPhase.label
                      cycleLabel.text = "Breath " + (BreathService.cycleCount + 1)
                  } else {
                      phaseLabel.text = "Ready"
                      cycleLabel.text = "Start it, then pocket the phone"
                  }
              }
          }
          KOTLIN

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: boxbreath-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish the APK as a release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk \
            app/build/outputs/apk/debug/app-debug.apk \
            --title 'Box Breath APK' \
            --notes 'Tap app-debug.apk below to install on your phone.' 
